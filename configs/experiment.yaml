seeds: [0, 1, 2]
time_budget_s: 120          # per run, same for every system

test_size: 0.2              # locked test set, split off first
val_size: 0.25               # of the remaining data

models: [logistic_regression, random_forest, xgboost, lightgbm]
optuna_trials: 20
tuning_timeout: false      # true also stops tuning by wall-clock time (not reproducible)

limits:
  lead_max_decisions: 4
  critic_max_sendbacks: 3
  code_max_retries: 2

critic:                     # tuned on dev datasets in Phase 6 (step 6.9)
  leakage_auc: 0.97
  id_ratio: 0.95
  dup_min_share: 0.05
  dup_ratio: 1.5
  rare_threshold: 0.10
  recall_threshold: 0.30
  overfit_gap: 0.30
  fairness_gap: 0.20
  max_sendbacks: 3

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0

paths:
  raw: data/raw
  processed: data/processed
  planted_flaws: data/planted_flaws
  results_raw: results/raw
  results_tables: results/tables
  results_figures: results/figures